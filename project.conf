name: homelab

# Required BuildStream version
min-version: 2.5

# Subdirectory where elements are stored
element-path: elements

(@):
  - freedesktop-sdk.bst:include/runtime.yml
  - include/aliases.yml

options:
  arch:
    type: arch
    description: Machine architecture
    variable: arch
    values:
      - x86_64

sandbox:
  build-arch: "%{arch}"

variables:
  # FSDK point release (must match the ref pinned in
  # elements/freedesktop-sdk.bst; enforced by
  # .github/scripts/check-release-version.py).
  installer-version: "26.08.0"

# Pull-only: read from the shared GNOME + Bluefin BuildStream CAS caches.
artifacts:
  - url: https://gbm.gnome.org:11003
    connection-config:
      keepalive-time: 180
      retry-limit: 5
      retry-delay: 500
      request-timeout: 180
  - url: https://cache.projectbluefin.io:11001
    connection-config:
      keepalive-time: 180
      retry-limit: 5
      retry-delay: 500
      request-timeout: 180

source-caches:
  - url: https://gbm.gnome.org:11003
    connection-config:
      keepalive-time: 180
      retry-limit: 5
      retry-delay: 500
      request-timeout: 180
  - url: https://cache.projectbluefin.io:11001
    connection-config:
      keepalive-time: 180
      retry-limit: 5
      retry-delay: 500
      request-timeout: 180

plugins:
- origin: junction
  junction: plugins/buildstream-plugins.bst
  elements:
  - make
  sources:
  - patch
  - docker
- origin: junction
  junction: plugins/buildstream-plugins-community.bst
  elements:
  - collect_manifest
  - git_repo
  - patch_queue
  - cargo2
  sources:
  - git_repo
  - patch_queue
  - cargo2
- origin: junction
  junction: freedesktop-sdk.bst
  elements:
  - collect_initial_scripts

sources:
  git_repo:
    config:
      ref-format: git-describe